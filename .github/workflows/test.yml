name: Test and coverage

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_test_password
          POSTGRES_DB: auth_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://app:app_test_password@localhost:5432/auth_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: make coverage
      - name: Show coverage summary
        run: cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error
          retention-days: 14
      - name: Build API
        env:
          CGO_ENABLED: '0'
          GOOS: linux
        run: go build -mod=readonly -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/api" ./cmd/api
      - name: Start local stack
        run: |
          docker compose config --quiet
          make up
      - name: Smoke test local stack
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 2 --retry-connrefused --max-time 5 http://localhost:8081/ready
          curl --fail --silent --show-error --max-time 5 http://localhost:8081/health
      - name: Show local stack logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop local stack
        if: always()
        run: make down
